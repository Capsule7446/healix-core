name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GO_VERSION: '1.26.4'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          go build ./...

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Package source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          asset="healix-core-${version}.tar.gz"
          git archive --format=tar.gz --prefix="healix-core-${version}/" "${GITHUB_SHA}" > "$asset"
          sha256sum "$asset" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          asset="healix-core-${version}.tar.gz"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            "$asset" SHA256SUMS
