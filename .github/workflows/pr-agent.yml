name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(fromJson('["/review","/describe","/improve"]'), github.event.comment.body) ||
      startsWith(github.event.comment.body, '/ask ')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check actor permission
        id: actor_permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check PR Agent configuration
        id: pr_agent_config
        if: steps.actor_permission.outputs.allowed == 'true'
        env:
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_BASE" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PR Agent secrets are not configured; skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: PR Agent
        if: steps.actor_permission.outputs.allowed == 'true' && steps.pr_agent_config.outputs.configured == 'true'
        uses: The-PR-Agent/pr-agent@b1328dff6c598633d78b69d1035298ca3f8aeffb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG__RESPONSE_LANGUAGE: zh-CN
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >-
            请使用中文审查 Go 代码，重点检查 API 兼容性、架构依赖、错误处理、
            敏感数据泄露、测试覆盖、gofmt、go vet、race test 和构建状态。
          PR_DESCRIPTION__EXTRA_INSTRUCTIONS: 请使用中文总结 PR 变更。
          PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: 请使用中文给出代码改进建议。
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
